spring:
  datasource:
    url: jdbc:h2:mem:notification;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  rabbitmq:
    listener:
      direct:
        auto-startup: false
      simple:
        auto-startup: false

eureka:
  client:
    enabled: false
