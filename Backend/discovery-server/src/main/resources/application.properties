spring.application.name=discovery-server
server.port=${SERVER_PORT:8761}
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

management.endpoints.web.exposure.include=health,info,metrics,loggers,env,beans,mappings
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=discovery-server
info.app.version=1.0.0
info.app.description=Spring Cloud Service Discovery Server - Eureka-based service discovery (SoukTn)
info.app.team=SoukTn - 4SSA16 - Groupe 5
