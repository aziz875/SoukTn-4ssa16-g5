spring:
  application:
    name: payment
  config:
    import: optional:configserver:${SPRING_CONFIG_IMPORT:http://localhost:8888}
  datasource:
    url: jdbc:h2:mem:payment_db
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${SERVER_PORT:8084}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,beans,mappings,configprops
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: payment-service
    version: 1.0.0
    description: Microservice de gestion des paiements et facturations (SoukTn)
    team: SoukTn - 4SSA16 - Groupe 5