spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${SPRING_CONFIG_IMPORT:http://localhost:8888}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: notification-service
              uri: lb://NOTIFICATION
              predicates:
                - Path=/api/notifications,/api/notifications/**,/api/reviews,/api/reviews/**
            - id: notification-openapi
              uri: lb://NOTIFICATION
              predicates:
                - Path=/notification/v3/api-docs
              filters:
                - RewritePath=/notification/v3/api-docs, /v3/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Notification Service
        url: /notification/v3/api-docs

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    reactor.netty.http.client: DEBUG

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
