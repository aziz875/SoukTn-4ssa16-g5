# FICHIER COMMUN : envoyé à TOUS les services.
# Ne mettre ici que ce qui est partagé (Eureka, RabbitMQ, Keycloak, Actuator).
# Réglages propres à un service -> config-repo/<nom-du-service>.yml (prioritaire).
# Toute modification de ce fichier : PR + accord de l'équipe.
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/marketplace

# Observabilité (Actuator) : endpoints exposés pour tous les services
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,mappings,loggers,configprops
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    project: SoukTn
    team: 4SSA16 - Groupe 5