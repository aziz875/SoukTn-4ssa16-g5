server:
  port: 8086

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/dispute_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update

# --- Observabilité (atelier Actuator) ---
# Propre à Dispute : le config-repo/application.yml commun est partagé avec toute l'équipe.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

eureka:
  client:
    # Transmet à Eureka le vrai statut de /health (DOWN si MySQL tombe)
    healthcheck:
      enabled: true

info:
  app:
    name: dispute
    version: 1.0.0
    description: Microservice de gestion des litiges et du support client
    team: SoukTn - 4SSA16 - Groupe 5
